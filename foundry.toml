[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 200


# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
[profile.zksync]
src = "src/zksync"
script = "script/zksync"
test = "test/zksync"
out = "out/zksync"
libs = ["lib/foundry-era-contracts"]
via_ir = true
optimizer = true
optimizer_runs = 200

#the modern way to enable the system mode for interacting with system contracts:
# enable_eravm_extensions = true
